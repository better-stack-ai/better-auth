name: Better DB Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing btst-v* or btst-cli-v* tag to publish
        required: true
        type: string
      release_scope:
        description: Publish the full cohort or @btst/cli only
        required: true
        default: cohort
        type: choice
        options:
          - cohort
          - cli

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on fork, not on upstream better-auth repo
    if: >-
      github.repository != 'better-auth/better-auth' &&
      (github.event_name == 'release' || inputs.release_scope == 'cohort')
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.1
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Build better-auth first (required dependency for btst)
          pnpm build --filter better-auth --force
          
          # Build btst packages explicitly (force rebuild, no cache)
          pnpm build --filter "@btst/*" --force
          
          # Verify dist folders exist
          echo "Checking dist folders..."
          ls -la packages/btst/db/dist/ || echo "❌ db/dist missing!"
          ls -la packages/btst/cli/dist/ || echo "❌ cli/dist missing!"
          ls -la packages/btst/plugins/dist/ || echo "❌ plugins/dist missing!"

      - name: Determine npm tag
        id: determine_npm_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^btst-v ]]; then
            echo "Release tag must start with btst-v; found $RELEASE_TAG"
            exit 1
          fi

          VERSION="${RELEASE_TAG#btst-v}"
          while IFS= read -r package_json; do
            PACKAGE_NAME=$(node -p "require('./$package_json').name")
            PACKAGE_VERSION=$(node -p "require('./$package_json').version")
            if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
              echo "$PACKAGE_NAME version ($PACKAGE_VERSION) does not match tag version ($VERSION)"
              exit 1
            fi
          done < <(find packages/btst -mindepth 2 -maxdepth 2 -name package.json -print | sort)

          if [[ "$VERSION" =~ -(next|canary|beta|rc|alpha) ]]; then
            NPM_TAG=${BASH_REMATCH[1]}
          else
            NPM_TAG="latest"
          fi

          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Using npm tag: $NPM_TAG for version: $VERSION"

      - name: Copy README to each package
        run: |
          # Copy main btst README to each package for npm
          cd packages/btst
          for dir in db cli plugins adapter-*; do
            if [ -d "$dir" ]; then
              echo "Copying README to @btst/${dir}..."
              cp README.md "$dir/"
            fi
          done

      - name: Verify package contents before publishing
        run: |
          cd packages/btst
          for dir in db cli plugins adapter-*; do
            if [ -d "$dir" ]; then
              echo "=== Checking @btst/${dir} ==="
              cd "$dir"
              echo "Files to be published:"
              npm pack --dry-run
              echo ""
              cd ..
            fi
          done

      - name: Publish @btst/* packages to npm
        env:
          NPM_TAG: ${{ steps.determine_npm_tag.outputs.npm_tag }}
        run: |
          set -euo pipefail

          # Only publish btst packages
          cd packages/btst
          mkdir -p "$RUNNER_TEMP/btst-packages"
          for dir in db cli plugins adapter-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              PACKAGE_VERSION=$(node -p "require('./package.json').version")
              if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
                echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping."
              else
                echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION..."
                PACKAGE_TARBALL=$(pnpm pack --json --pack-destination "$RUNNER_TEMP/btst-packages" | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).filename))')
                if tar -xOf "$PACKAGE_TARBALL" package/package.json | grep -q 'workspace:'; then
                  echo "$PACKAGE_NAME@$PACKAGE_VERSION tarball contains an unresolved workspace dependency"
                  exit 1
                fi
                npm publish "$PACKAGE_TARBALL" --access public --provenance --tag "$NPM_TAG"
              fi
              cd ..
            fi
          done

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/
          retention-days: 7

  release-cli:
    runs-on: ubuntu-latest
    if: >-
      github.repository != 'better-auth/better-auth' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_scope == 'cli'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.1
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Validate CLI-only release plan
        id: release_plan
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: pnpm tsx scripts/btst-cli-release-plan.ts "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build CLI and its dependencies
        run: pnpm turbo build --filter=@btst/cli...

      - name: Prepare and verify CLI package
        env:
          PACKAGE_DIRECTORY: ${{ steps.release_plan.outputs.package_directory }}
          PACKAGE_NAME: ${{ steps.release_plan.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          set -euo pipefail
          test "$PACKAGE_DIRECTORY" = "packages/btst/cli"
          test "$PACKAGE_NAME" = "@btst/cli"
          test "$(node -p "require('./$PACKAGE_DIRECTORY/package.json').name")" = "$PACKAGE_NAME"
          test "$(node -p "require('./$PACKAGE_DIRECTORY/package.json').version")" = "$PACKAGE_VERSION"
          cp packages/btst/README.md "$PACKAGE_DIRECTORY/README.md"
          cd "$PACKAGE_DIRECTORY"
          npm pack --dry-run

      - name: Publish @btst/cli to npm
        env:
          NPM_TAG: ${{ steps.release_plan.outputs.npm_tag }}
          PACKAGE_DIRECTORY: ${{ steps.release_plan.outputs.package_directory }}
          PACKAGE_NAME: ${{ steps.release_plan.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          set -euo pipefail
          test "$PACKAGE_DIRECTORY" = "packages/btst/cli"
          test "$PACKAGE_NAME" = "@btst/cli"
          mkdir -p "$RUNNER_TEMP/btst-cli-package"
          PACKAGE_TARBALL=$(pnpm --dir "$PACKAGE_DIRECTORY" pack --json --pack-destination "$RUNNER_TEMP/btst-cli-package" | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).filename))')
          test "$(tar -xOf "$PACKAGE_TARBALL" package/package.json | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).name))')" = "$PACKAGE_NAME"
          test "$(tar -xOf "$PACKAGE_TARBALL" package/package.json | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))')" = "$PACKAGE_VERSION"
          if tar -xOf "$PACKAGE_TARBALL" package/package.json | grep -q 'workspace:'; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION tarball contains an unresolved workspace dependency"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping."
          else
            npm publish "$PACKAGE_TARBALL" --access public --provenance --tag "$NPM_TAG"
          fi

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-debug-logs-cli
          path: /home/runner/.npm/_logs/
          retention-days: 7
